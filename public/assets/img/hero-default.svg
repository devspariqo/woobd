<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-label="Website design illustration">
  <title>Hero illustration</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21f0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="hscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f8fc"/>
    </linearGradient>
  </defs>

  <rect width="880" height="660" rx="28" fill="url(#hbg)"/>

  <!-- Back panel: a phone, hinting at responsive builds -->
  <g transform="translate(96 250)">
    <rect x="0" y="0" width="168" height="300" rx="26" fill="#ffffff" stroke="#e3e5f0" stroke-width="2.5"/>
    <rect x="56" y="14" width="56" height="9" rx="4.5" fill="#eef0f8"/>
    <rect x="20" y="44" width="128" height="64" rx="12" fill="#5b21f0" opacity=".16"/>
    <rect x="20" y="122" width="128" height="11" rx="5.5" fill="#c9cde0"/>
    <rect x="20" y="141" width="94" height="11" rx="5.5" fill="#dfe2ee"/>
    <rect x="20" y="176" width="128" height="42" rx="10" fill="#ff6600" opacity=".82"/>
    <rect x="20" y="236" width="128" height="42" rx="10" fill="#eef0f8" stroke="#e3e5f0"/>
  </g>

  <!-- Main panel: the storefront window -->
  <g transform="translate(210 96)">
    <rect x="0" y="0" width="560" height="392" rx="22" fill="url(#hscreen)" stroke="#e3e5f0" stroke-width="2.5"/>
    <!-- Chrome -->
    <path d="M0 22A22 22 0 0 1 22 0h516a22 22 0 0 1 22 22v30H0V22Z" fill="#eef0f8"/>
    <circle cx="26" cy="26" r="6" fill="#e02b2b" opacity=".5"/>
    <circle cx="48" cy="26" r="6" fill="#f0a020" opacity=".5"/>
    <circle cx="70" cy="26" r="6" fill="#0f9d58" opacity=".5"/>
    <rect x="96" y="17" width="260" height="18" rx="9" fill="#ffffff" stroke="#e3e5f0"/>
    <!-- Nav row -->
    <rect x="30" y="76" width="86" height="16" rx="8" fill="#5b21f0" opacity=".7"/>
    <g fill="#c9cde0">
      <rect x="316" y="79" width="52" height="10" rx="5"/>
      <rect x="384" y="79" width="52" height="10" rx="5"/>
      <rect x="452" y="79" width="52" height="10" rx="5"/>
    </g>
    <rect x="512" y="70" width="24" height="24" rx="8" fill="#8a90ad"/>
    <!-- Hero copy -->
    <rect x="30" y="126" width="300" height="24" rx="12" fill="#101223" opacity=".82"/>
    <rect x="30" y="160" width="228" height="24" rx="12" fill="#5b21f0" opacity=".5"/>
    <rect x="30" y="204" width="266" height="11" rx="5.5" fill="#c9cde0"/>
    <rect x="30" y="224" width="212" height="11" rx="5.5" fill="#dfe2ee"/>
    <rect x="30" y="258" width="126" height="42" rx="12" fill="#ff6600"/>
    <rect x="170" y="258" width="118" height="42" rx="12" fill="#ffffff" stroke="#dfe2ee" stroke-width="2"/>
    <!-- Product cards -->
    <g fill="#ffffff" stroke="#e3e5f0" stroke-width="1.5">
      <rect x="366" y="122" width="164" height="180" rx="14"/>
    </g>
    <rect x="384" y="140" width="128" height="86" rx="10" fill="#5b21f0" opacity=".14"/>
    <rect x="384" y="240" width="104" height="10" rx="5" fill="#c9cde0"/>
    <rect x="384" y="258" width="68" height="10" rx="5" fill="#ff6600" opacity=".7"/>
    <!-- Stats strip -->
    <g fill="#eef0f8" stroke="#e3e5f0">
      <rect x="30" y="322" width="156" height="44" rx="12"/>
      <rect x="202" y="322" width="156" height="44" rx="12"/>
      <rect x="374" y="322" width="156" height="44" rx="12"/>
    </g>
  </g>

  <!-- Floating accent: a verified / live badge -->
  <g transform="translate(700 400)">
    <rect x="0" y="0" width="132" height="52" rx="26" fill="#ffffff" stroke="#e3e5f0" stroke-width="2"/>
    <circle cx="30" cy="26" r="13" fill="#0f9d58" opacity=".16"/>
    <path d="M24 26.5l4.4 4.4 8.2-8.6" fill="none" stroke="#0f9d58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="19" width="62" height="9" rx="4.5" fill="#c9cde0"/>
    <rect x="52" y="34" width="44" height="8" rx="4" fill="#eef0f8"/>
  </g>
</svg>
