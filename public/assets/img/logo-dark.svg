<svg xmlns="http://www.w3.org/2000/svg" width="196" height="44" viewBox="0 0 196 44" role="img" aria-label="WooBD.Com">
  <title>WooBD.Com</title>

  <!-- Dark-mode variant: the same mark, lightened so it reads on a dark header. -->
  <defs>
    <linearGradient id="wbdMarkDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d7bff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="6" width="32" height="32" rx="9" fill="url(#wbdMarkDark)"/>

  <!-- Awning, cut in the dark surface colour so it stays legible on the lighter mark -->
  <path d="M7.5 15.5h19v4.2a2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-3.4-1.4z"
        fill="#0c0e1a" opacity=".88"/>

  <!-- Shopfront -->
  <rect x="10" y="23" width="7.5" height="9" rx="1.4" fill="#0c0e1a" opacity=".85"/>
  <rect x="20" y="23" width="6.5" height="5.2" rx="1.4" fill="#0c0e1a" opacity=".5"/>

  <!-- Wordmark in light text, for dark backgrounds -->
  <text x="41" y="29.5"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#eef0f8">Woo</tspan><tspan fill="#9d7bff">BD</tspan><tspan fill="#ff6600">.</tspan><tspan fill="#8a90ad" font-weight="600" font-size="15">Com</tspan>
  </text>
</svg>
