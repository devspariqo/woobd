<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-label="About WooBD.Com">
  <title>About illustration</title>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21f0" stop-opacity=".15"/>
      <stop offset="1" stop-color="#5b21f0" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="760" height="620" rx="26" fill="url(#abg)"/>

  <!-- A team workspace: desk, monitor, two people -->
  <g transform="translate(120 150)">
    <!-- Monitor -->
    <rect x="0" y="0" width="360" height="228" rx="18" fill="#ffffff" stroke="#e3e5f0" stroke-width="2.5"/>
    <path d="M0 18A18 18 0 0 1 18 0h324a18 18 0 0 1 18 18v20H0V18Z" fill="#eef0f8"/>
    <rect x="22" y="58" width="140" height="14" rx="7" fill="#5b21f0" opacity=".7"/>
    <rect x="22" y="84" width="220" height="10" rx="5" fill="#c9cde0"/>
    <rect x="22" y="102" width="176" height="10" rx="5" fill="#dfe2ee"/>
    <rect x="22" y="130" width="96" height="32" rx="10" fill="#ff6600" opacity=".85"/>
    <g fill="#eef0f8" stroke="#e3e5f0">
      <rect x="22" y="178" width="98" height="32" rx="9"/>
      <rect x="132" y="178" width="98" height="32" rx="9"/>
      <rect x="242" y="178" width="98" height="32" rx="9"/>
    </g>
    <!-- Monitor stand -->
    <rect x="156" y="228" width="48" height="30" fill="#dfe2ee"/>
    <rect x="112" y="258" width="136" height="12" rx="6" fill="#c9cde0"/>
    <!-- Laptop, offset to the right -->
    <g transform="translate(392 128)">
      <path d="M0 0h232a14 14 0 0 1 14 14v128H0V14A14 14 0 0 1 14 0h-14Z" fill="#ffffff" stroke="#e3e5f0" stroke-width="2.5"/>
      <rect x="18" y="20" width="110" height="12" rx="6" fill="#5b21f0" opacity=".6"/>
      <rect x="18" y="44" width="180" height="9" rx="4.5" fill="#dfe2ee"/>
      <rect x="18" y="62" width="148" height="9" rx="4.5" fill="#eef0f8"/>
      <rect x="18" y="88" width="84" height="30" rx="9" fill="#8a90ad"/>
      <path d="M-14 142h260l18 22H-32l18-22Z" fill="#eef0f8" stroke="#e3e5f0" stroke-width="2"/>
    </g>
    <!-- Desk -->
    <rect x="-70" y="292" width="600" height="16" rx="8" fill="#c9cde0"/>
    <rect x="-46" y="308" width="16" height="120" rx="6" fill="#dfe2ee"/>
    <rect x="484" y="308" width="16" height="120" rx="6" fill="#dfe2ee"/>
  </g>

  <!-- Accent: a handover / handshake badge, the "we give you the keys" promise -->
  <g transform="translate(560 432)">
    <rect x="0" y="0" width="152" height="88" rx="20" fill="#ffffff" stroke="#e3e5f0" stroke-width="2"/>
    <circle cx="42" cy="44" r="19" fill="#5b21f0" opacity=".14"/>
    <!-- key glyph -->
    <circle cx="36" cy="40" r="6" fill="none" stroke="#5b21f0" stroke-width="3"/>
    <path d="M41 44l14 14m-6-8l5 5m-11-3l4 4" fill="none" stroke="#5b21f0" stroke-width="3" stroke-linecap="round"/>
    <rect x="76" y="30" width="58" height="10" rx="5" fill="#c9cde0"/>
    <rect x="76" y="48" width="40" height="8" rx="4" fill="#eef0f8"/>
  </g>

  <!-- Accent: location pin for the Rangpur office -->
  <g transform="translate(76 62)">
    <rect x="0" y="0" width="150" height="56" rx="18" fill="#ffffff" stroke="#e3e5f0" stroke-width="2"/>
    <path d="M30 16c-6 0-11 5-11 11 0 8 11 18 11 18s11-10 11-18c0-6-5-11-11-11Z" fill="#ff6600" opacity=".85"/>
    <circle cx="30" cy="27" r="4" fill="#ffffff"/>
    <rect x="54" y="20" width="72" height="9" rx="4.5" fill="#c9cde0"/>
    <rect x="54" y="35" width="50" height="8" rx="4" fill="#eef0f8"/>
  </g>
</svg>
